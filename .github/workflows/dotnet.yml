name: .Net Core

on: [push]

jobs:
  build-analyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.4.2
        with:
          versionSpec: '6.x'
      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.4.2

      - name: Truncate Version for NuGet
        id: version
        run: |
          VERSION="${{ steps.gitversion.outputs.fullSemVer }}"
          MAX_LENGTH=60
          if [ ${#VERSION} -gt $MAX_LENGTH ]; then
            # Extract the build number suffix (last segment after final dot)
            SUFFIX=".${VERSION##*.}"
            # Get everything before the suffix
            PREFIX="${VERSION%.*}"
            # Calculate how much of prefix we can keep
            AVAILABLE=$((MAX_LENGTH - ${#SUFFIX}))
            # Truncate prefix and reassemble
            VERSION="${PREFIX:0:$AVAILABLE}$SUFFIX"
          fi
          echo "nugetVersion=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: 8.0.x

      - name: Pack
        run: dotnet pack src/ReGenSource/ReGenSource.csproj -c Release -o ./publish /p:Version="${{ steps.version.outputs.nugetVersion }}"

      - name: Push to NuGet
        run: dotnet nuget push ./publish/**.nupkg -s https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }}

  build-testapp-projectreference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: 8.0.x
      - name: BuildWithProjectReference
        run: dotnet build src/MyTestApplication/MyTestApplication.csproj -c Release

  build-testapp-packagereference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: 8.0.x
      - name: BuildWithProjectReference
        run: |
          chmod +x src/MyTestApplication/build_with_local_nuget.sh
          ./src/MyTestApplication/build_with_local_nuget.sh

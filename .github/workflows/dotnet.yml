name: .Net Core

on:
  push:
    branches:
      - '**'
    tags:
      - '*'

jobs:
  build-analyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine Version
        id: version
        run: |
          # Versioning strategy:
          #   * Tag push        -> the tag is authoritative (e.g. 0.6.0). Publishes.
          #   * main            -> last tag + ".<commits since tag>" (e.g. 0.6.0.3). Publishes.
          #   * feature branch  -> prerelease "<base>-<branch>.<commits since tag>"
          #                        (e.g. 0.6.0-my-branch.3). Does NOT publish.
          TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo '')"
          if [ -n "$TAG" ]; then
            BASE="$TAG"
            COUNT="$(git rev-list --count "${TAG}..HEAD")"
          else
            BASE="0.0.0"
            COUNT="$(git rev-list --count HEAD)"
          fi

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="$GITHUB_REF_NAME"
            PUBLISH=true
          elif [ "$GITHUB_REF_NAME" = "main" ]; then
            if [ "$COUNT" -eq 0 ]; then VERSION="$BASE"; else VERSION="${BASE}.${COUNT}"; fi
            PUBLISH=true
          else
            # SemVer prerelease label: only [0-9A-Za-z-] are legal, so sanitize the branch name.
            LABEL="$(echo "$GITHUB_REF_NAME" | sed 's/[^0-9A-Za-z-]/-/g')"
            VERSION="${BASE}-${LABEL}.${COUNT}"
            PUBLISH=false
          fi

          echo "Resolved version: $VERSION (publish=$PUBLISH)"
          echo "nugetVersion=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Pack
        if: steps.version.outputs.publish == 'true'
        run: dotnet pack src/ReGenSource/ReGenSource.csproj -c Release -o ./publish /p:Version="${{ steps.version.outputs.nugetVersion }}"

      - name: Push to NuGet
        if: steps.version.outputs.publish == 'true'
        run: dotnet nuget push ./publish/**.nupkg -s https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate

  build-testapp-projectreference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: BuildWithProjectReference
        run: dotnet build src/MyTestApplication/MyTestApplication.csproj -c Release

  build-testapp-packagereference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: BuildWithProjectReference
        run: |
          chmod +x src/MyTestApplication/build_with_local_nuget.sh
          ./src/MyTestApplication/build_with_local_nuget.sh
